
name: Build signed Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare signing and SDK
        env:
          KEYSTORE_BASE64: ${{ secrets.KN_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing signing secret'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/khue-nha-release.jks"
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build release APK
        working-directory: apps/android
        env:
          KN_KEYSTORE_PATH: ${{ runner.temp }}/khue-nha-release.jks
          KN_KEYSTORE_PASSWORD: ${{ secrets.KN_KEYSTORE_PASSWORD }}
          KN_KEY_PASSWORD: ${{ secrets.KN_KEY_PASSWORD }}
          KN_KEY_ALIAS: khue-nha
        run: gradle --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: GuiKhueNha-release-apk
          path: apps/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
      - name: Remove temporary key
        if: always()
        run: rm -f "$RUNNER_TEMP/khue-nha-release.jks"
