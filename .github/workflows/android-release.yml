name: Build signed Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Android release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted Ubuntu includes an Android SDK. Avoid setup-android@v3:
      # it attempts to install obsolete sdkmanager package 'tools'.
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?GitHub runner is missing ANDROID_HOME}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "Missing SDK manager at $SDKMANAGER" >&2
            exit 1
          fi
          echo "Using SDK manager: $SDKMANAGER"
          "$SDKMANAGER" --version
          # sdkmanager only installs selected packages, NOT obsolete 'tools'.
          # Avoid a pipefail error caused by `yes` exiting on SIGPIPE.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null
          license_status=${PIPESTATUS[1]}
          set -o pipefail
          if [ "$license_status" -ne 0 ]; then
            echo "Accepting SDK licenses failed ($license_status)" >&2
            exit "$license_status"
          fi
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KN_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KN_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KN_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for var in KEYSTORE_BASE64 STORE_PASSWORD KEY_PASSWORD; do
            if [ -z "${!var:-}" ]; then
              echo "Missing GitHub Actions signing secret for: $var" >&2
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/khue-nha-release.jks"
          chmod 600 "$RUNNER_TEMP/khue-nha-release.jks"
          test -s "$RUNNER_TEMP/khue-nha-release.jks"

      - name: Build signed release APK
        working-directory: apps/android
        env:
          KN_KEYSTORE_PATH: ${{ runner.temp }}/khue-nha-release.jks
          KN_KEYSTORE_PASSWORD: ${{ secrets.KN_KEYSTORE_PASSWORD }}
          KN_KEY_PASSWORD: ${{ secrets.KN_KEY_PASSWORD }}
          KN_KEY_ALIAS: khue-nha
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          APK='apps/android/app/build/outputs/apk/release/app-release.apk'
          test -s "$APK" || { echo 'No release APK produced' >&2; exit 1; }
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GuiKhueNha-v1.7.1-release-apk
          path: apps/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/khue-nha-release.jks"
